<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101f">
<meta name="application-name" content="Hyper Direct">
<meta name="apple-mobile-web-app-title" content="Hyper Direct">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">
<link rel="apple-touch-icon" href="./icon.svg?v=2">
<link rel="manifest" href="./manifest.webmanifest">
<meta http-equiv="Cache-Control" content="no-store">
<title>Hyper Direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06101f;--panel:#0d1b30;--panel2:#10233b;--line:#1b4260;--cyan:#39e7ff;--blue:#318bff;--muted:#9ab6cc;--white:#edfaff}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:radial-gradient(ellipse at 50% -10%,#123e68 0%,#09182b 42%,var(--bg) 78%);background-attachment:fixed;color:var(--white);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:28px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mascot{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 6px #0008) drop-shadow(0 0 8px #39e7ff22)}.mascot svg{width:100%;height:100%;display:block;overflow:visible}.mascot svg g.hd-eye rect{transition:x .12s ease,y .12s ease,height .09s ease}.brand-title{font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:-1.1px;line-height:1.1;background:linear-gradient(90deg,#f3fdff 0%,var(--cyan) 48%,#78aaff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #39e7ff22}
.brand-copy{display:flex;flex-direction:column;gap:4px;min-width:0}.tagline{margin:0;color:var(--muted);font-size:13px;line-height:1.45;letter-spacing:.01em}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10233bea,#09172bed);border-radius:20px;padding:19px;margin-top:14px;border:1px solid var(--line);box-shadow:0 12px 35px #00000030}
.menu-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;margin-top:14px}
.menu-layout>.card{margin-top:0;min-width:0;padding:16px}
.menu-layout .code{font-size:clamp(17px,4vw,28px);letter-spacing:clamp(2px,1vw,6px);padding:14px 5px}
.menu-layout .small{font-size:12px}
.menu-layout .send-card{grid-column:1 / -1;width:min(100%,440px);justify-self:center}
.menu-layout button,.menu-layout input{min-width:0}
@media(max-width:390px){.menu-layout{gap:8px}.menu-layout>.card{padding:12px}.menu-layout .step{font-size:9px;letter-spacing:1px}.menu-layout button{padding:11px 7px;font-size:13px}.menu-layout .code{letter-spacing:2px;font-size:17px}}
@media(min-width:520px){.menu-layout>.card{padding:20px}}

.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent);opacity:.8}
.card h3{margin:0 0 8px}
.step{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan)}
.small{font-size:13px;color:var(--muted);line-height:1.65}

.code{text-align:center;font-size:clamp(27px,7vw,34px);font-weight:900;letter-spacing:7px;padding:16px 12px;background:linear-gradient(135deg,#071628,#102b46);border:1px solid #246486;border-radius:15px;margin-top:13px;color:#a5f6ff;text-shadow:0 0 18px #39e7ff55;box-shadow:inset 0 0 22px #39e7ff0b}
.status{padding:13px 14px;border-radius:13px;background:#081729;border:1px solid #193b56;margin-top:12px;color:#d3eaf7;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.status.connected{color:#8dffb0;background:rgba(25,255,112,.10);border:1px solid #39ff83;box-shadow:0 0 10px rgba(35,255,112,.22),inset 0 0 12px rgba(35,255,112,.06);font-weight:800;text-shadow:0 0 8px rgba(57,255,131,.28)}
.status.connected::before{content:"✓ ";display:inline-block;color:#39ff83;font-weight:900}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #27506d;font:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button{background:linear-gradient(100deg,#1677e8,#12bdd8);color:#031322;border:1px solid #52eaff;font-weight:850;margin-top:9px;box-shadow:0 5px 18px #0bbbd52a;cursor:pointer}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:hover{box-shadow:0 0 22px #39e7ff40}
input{background:#071629;color:var(--white)}
input::placeholder{color:#7192aa}
input[type=file]{background:#09192b;color:var(--muted);font-size:13px}
input[type=text]{text-transform:uppercase}
.files{margin-top:10px;display:grid;gap:8px}
.fileitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:#0b1c2f;border:1px solid #1d4c69;border-radius:12px}
.fileitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5f8ff}
.fileitem a{font-weight:800;color:var(--cyan);text-decoration:none;white-space:nowrap}
@media(min-width:520px){.wrap{padding-top:36px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Landing / splash ===== */
.landing{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(0px + 24px) 20px calc(0px + 28px);padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);background:radial-gradient(120% 70% at 50% 0%,#0f1d3d 0%,#070b18 55%,#04060d 100%);transition:opacity .45s ease,transform .45s ease}
.landing.out{opacity:0;transform:scale(1.04);pointer-events:none}
.stars,.stars2{position:absolute;top:-20px;right:-20px;bottom:-20px;left:-20px;pointer-events:none;background-repeat:repeat}
.stars{background-size:220px 220px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 60px 120px,#e6f6ff,transparent),radial-gradient(2px 2px at 140px 60px,#fff,transparent),radial-gradient(1.4px 1.4px at 180px 170px,#cff,transparent),radial-gradient(1.8px 1.8px at 100px 200px,#fff,transparent);animation:twinkle 4.5s ease-in-out infinite}
.stars2{background-size:160px 160px;background-image:radial-gradient(1px 1px at 10px 90px,#fff,transparent),radial-gradient(1px 1px at 80px 20px,#bdf,transparent),radial-gradient(1.2px 1.2px at 130px 130px,#fff,transparent),radial-gradient(1px 1px at 50px 150px,#cff,transparent);animation:twinkle 3.2s ease-in-out infinite reverse;opacity:.7}
@keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.35}}
.l-glow{position:absolute;width:520px;height:520px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.13),transparent 62%);pointer-events:none}
.l-mascot{position:relative;width:160px;height:160px;width:clamp(132px,40vw,184px);height:clamp(132px,40vw,184px);animation:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(34,211,238,.25))}
.l-mascot svg{width:100%;height:100%;display:block;overflow:visible}
.l-mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.l-shadow{width:90px;width:clamp(72px,22vw,104px);height:12px;margin:10px auto 0;border-radius:50%;background:rgba(34,211,238,.35);filter:blur(7px);animation:none}
@keyframes lshadow{0%,100%{transform:scaleX(1);opacity:.65}50%{transform:scaleX(.7);opacity:.32}}
.l-title{position:relative;margin:30px 0 10px;font-family:'Orbitron','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:2.6rem;font-size:clamp(2.15rem,11.2vw,4.6rem);line-height:1.1;letter-spacing:.04em;background:linear-gradient(90deg,#22d3ee 0%,#38bdf8 45%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(34,211,238,.25)) drop-shadow(0 0 26px rgba(59,130,246,.16))}
.l-title span{display:inline-block}
.l-tag{position:relative;color:#fff;font-size:12px;letter-spacing:.32em;font-weight:600;margin:0 0 44px;padding-left:.32em}
.l-btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 38px;border-radius:999px;border:1.5px solid rgba(34,211,238,.75);background:rgba(17,25,40,.55);color:#22d3ee;font-weight:800;font-size:15px;letter-spacing:.18em;box-shadow:0 0 22px -6px rgba(34,211,238,.6),inset 0 0 14px rgba(34,211,238,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s,background .15s,color .15s}
.l-btn:active{transform:scale(.96);background:rgba(8,51,68,.7);color:#fff}
.l-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
.landing.fx{touch-action:none}
.landing.fx .l-canvas{display:block}
.landing.fx .stars,.landing.fx .stars2{display:none}
.landing.fx .l-mascot .m-eye{animation:none}
.l-flash{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95) 0%,rgba(165,243,252,.55) 22%,rgba(14,116,144,0) 62%)}
/* judul diketik huruf demi huruf (gradien per huruf diatur JS agar tetap menyambung) */
.l-title.lt{background:none}
.l-title .ch{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:no-repeat,no-repeat}
.l-title.typing .ch{opacity:0;transform:translateY(.14em) scale(.88)}
.l-title.typing .ch.on{opacity:1;transform:none;transition:opacity .16s ease,transform .26s cubic-bezier(.2,1.5,.4,1)}
.l-caret{position:absolute;width:.07em;height:.82em;background:#22d3ee;box-shadow:0 0 10px #22d3ee;border-radius:2px;animation:caret .8s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
.l-title .ch{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:no-repeat,no-repeat}
.l-title.typing .ch{opacity:0;transform:translateY(.14em) scale(.88)}
.l-title.typing .ch.on{opacity:1;transform:none;transition:opacity .16s ease,transform .26s cubic-bezier(.2,1.5,.4,1)}
.l-caret{position:absolute;width:.07em;height:.82em;background:#22d3ee;box-shadow:0 0 10px #22d3ee;border-radius:2px;animation:caret .8s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
.landing.fx .l-tag{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.landing.fx.typed .l-tag{opacity:1;transform:none}
/* warp saat MULAI ditekan */
.landing.warp{pointer-events:none}
.landing.warp .l-mascot{animation:lwarp .8s cubic-bezier(.5,0,.75,.2) forwards}
@keyframes lwarp{0%{transform:translateY(0)}18%{transform:translateY(10px) scale(1.06,.92)}100%{transform:translateY(-75vh) scale(.42,.6)}}
.landing.warp .l-shadow{opacity:0;transition:opacity .2s}
.landing.warp .l-title,.landing.warp .l-tag,.landing.fx.typed.warp .l-tag,.landing.warp .l-btn,.landing.warp .l-foot{opacity:0;transform:scale(.9) translateY(14px);transition:opacity .35s ease,transform .45s ease}
.landing.warp .l-flash{animation:lflash .8s ease-in forwards}
@keyframes lflash{0%,55%{opacity:0}100%{opacity:.9}}
.landing.warp.out{transition:opacity .3s ease}
.l-foot{position:absolute;left:0;right:0;bottom:calc(0px + 16px);bottom:calc(env(safe-area-inset-bottom) + 16px);font-size:11px;color:rgba(148,163,184,.6);letter-spacing:.08em}
/* petunjuk pasang aplikasi (kecil, bisa ditutup) */
.install-hint{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:12px}
.install-hint.hidden{display:none}
.ih-main{display:inline-flex;align-items:center;gap:7px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.28);color:#a5f3fc;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px}
.ih-x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px}
.ios-steps{margin:6px 0 14px;padding-left:20px;line-height:1.7;color:var(--text)}
.ios-steps b{color:#a5f3fc}
/* mode aplikasi (standalone): status bar transparan → beri ruang aman */
@media (display-mode: standalone){html,body{overscroll-behavior-y:none}.landing{padding-top:calc(env(safe-area-inset-top) + 32px)}}
/* kompatibilitas browser lama */
button{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.acard>*,.acard svg{pointer-events:none}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(34,211,238,.75);outline-offset:2px}
@supports not (aspect-ratio:1/1){
  .tile{height:0;padding:0 0 100%!important}
  .tile img,.tile video{position:absolute;top:0;left:0}
  .tile.loading>div{position:absolute;top:50%;left:50%;width:90%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.grid3{grid-template-columns:repeat(4,1fr)}}
/* Perbaikan tombol MULAI landing: pulihkan tampilan tombol utama HD1 */
.landing .l-btn{
  display:inline-flex!important;
  width:auto!important;
  min-width:112px;
  min-height:40px;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 24px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#22d3ee,#2563eb);
  color:#061322;
  font-weight:800;
  font-size:13px;
  letter-spacing:.14em;
  line-height:1.1;
  white-space:nowrap;
  box-shadow:0 8px 22px -8px rgba(34,211,238,.7);
  opacity:1;
  visibility:visible;
}
.landing .l-btn svg{display:block;flex:0 0 16px;width:16px;height:16px}
.landing .l-btn:active{transform:scale(.96);background:linear-gradient(135deg,#67e8f9,#3b82f6);color:#061322}
</style>
</head>
<body>

<section class="landing" id="landing" aria-label="Hyper Direct">
  <div class="stars"></div><div class="stars2"></div><canvas class="l-canvas" id="lCanvas" aria-hidden="true"></canvas><div class="l-glow"></div><div class="l-flash" aria-hidden="true"></div>
  <div class="l-mascot" role="img" aria-label="Maskot Hyper Direct">
    <svg viewBox="0 0 100 100" focusable="false">
      <defs>
        <radialGradient id="mg2" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eef1f6"/><stop offset=".82" stop-color="#cfd5de"/><stop offset="1" stop-color="#aeb6c2"/></radialGradient>
        <clipPath id="mc2"><circle cx="50" cy="50" r="47.5"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="49" fill="url(#mg2)"/>
      <circle cx="50" cy="50" r="48.4" fill="none" stroke="rgba(15,23,42,.12)" stroke-width="1.2"/>
      <ellipse cx="30" cy="24" rx="15" ry="7" fill="#fff" opacity=".9" transform="rotate(-35 30 24)"/>
      <g clip-path="url(#mc2)">
        <g id="lCheeks"><ellipse cx="53" cy="47" rx="6" ry="3.2" fill="#ff8fb1" opacity=".5" transform="rotate(-25 53 47)"/>
        <ellipse cx="86" cy="42" rx="5" ry="2.8" fill="#ff8fb1" opacity=".5" transform="rotate(-25 86 42)"/></g>
        <g id="lEyes"><g transform="rotate(-25 60 30.5)"><rect class="m-eye" x="55" y="21" width="10" height="19" rx="5" fill="#111318"/></g>
        <g transform="rotate(-25 80 26.5)"><rect class="m-eye" x="75.75" y="17.5" width="8.5" height="18" rx="4.25" fill="#111318"/></g></g>
      </g>
    </svg>
  </div>
  <div class="l-shadow"></div>
  <h1 class="l-title" id="lTitle" aria-label="HYPER DIRECT"><span class="w">HYPER</span> <span class="w">DIRECT</span></h1>
  <p class="l-tag">NEXT IS NOW</p>
  <button type="button" class="l-btn" id="startBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>START</button>
  <div class="l-foot">official broadcaster | martaedhyx</div>
</section>
<script>
(function(){
  var L=document.getElementById('landing'), cv=document.getElementById('lCanvas'), title=document.getElementById('lTitle');
  if(!L||!cv||!title)return;
  var ctx=cv.getContext&&cv.getContext('2d'), stars=[], raf=0, reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w=1,h=1,dpr=1,cx=0,cy=0,last=0,nextShoot=0,shoot=null;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function newStar(any){return{x:rnd(-.6,.6)*w,y:rnd(-.6,.6)*h,z:any?rnd(.08,1):1,p:rnd(0,6.28),tw:rnd(1,3),c:Math.random()<.22?'191,239,255':'255,255,255'}}
  function size(){
    var r=L.getBoundingClientRect(),m=document.querySelector('.l-mascot').getBoundingClientRect();
    w=Math.max(1,r.width);h=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,1.5);
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';cv.style.display='block';
    if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=m.width?m.left+m.width/2-r.left:w/2;cy=m.height?m.top+m.height/2-r.top:h*.4;
    var want=Math.min(160,Math.max(50,Math.round(w*h/2300)));
    while(stars.length<want)stars.push(newStar(true));stars.length=want;
  }
  function proj(s,z){return[cx+s.x/z,cy+s.y/z]}
  function draw(t){
    if(!ctx||!L.isConnected||L.style.display==='none')return;
    var dt=Math.min(.05,last?(t-last)/1000:.016);last=t;ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],prev=s.z;s.z-=.045*dt;
      if(s.z<=.03){stars[i]=newStar(false);continue}
      var q=proj(s,s.z);if(q[0]<-40||q[0]>w+40||q[1]<-40||q[1]>h+40){stars[i]=newStar(false);continue}
      var near=1-s.z,a=Math.min(1,near*1.2+.4)*Math.min(1,near/.08);
      a*=.72+.28*Math.sin(t/1000*s.tw+s.p);var r=.75+near*2;
      ctx.fillStyle='rgba('+s.c+','+a+')';ctx.fillRect(q[0]-r/2,q[1]-r/2,r,r);
    }
    if(!shoot&&t>nextShoot){
      var left=Math.random()<.5,ang=(left?205:335)*Math.PI/180+rnd(-.12,.12),v=rnd(.9,1.25)*Math.max(w,360);
      shoot={x:rnd(.25,.85)*w*(left?1:.8),y:rnd(.03,.3)*h,vx:Math.cos(ang)*v,vy:Math.abs(Math.sin(ang))*v,t0:t,dur:rnd(650,950),len:rnd(80,140)};
      if(!left)shoot.vx=Math.abs(shoot.vx);nextShoot=t+rnd(3500,8000);
    }
    if(shoot){var o=shoot,p=(t-o.t0)/o.dur;if(p>=1)shoot=null;else{
      var hx=o.x+o.vx*(t-o.t0)/1000,hy=o.y+o.vy*(t-o.t0)/1000,n=Math.hypot(o.vx,o.vy),tx=hx-o.vx/n*o.len,ty=hy-o.vy/n*o.len,al=Math.sin(Math.PI*p),g=ctx.createLinearGradient(hx,hy,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(.3,'rgba(165,243,252,'+al*.5+')');g.addColorStop(1,'rgba(165,243,252,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();ctx.fillStyle='rgba(255,255,255,'+al+')';ctx.beginPath();ctx.arc(hx,hy,1.6,0,6.283);ctx.fill();
    }}
    animateGlint(t);if(!reduced)raf=requestAnimationFrame(draw);
  }
  L.querySelector('.stars').style.display='none';L.querySelector('.stars2').style.display='none';
  size();nextShoot=performance.now()+rnd(1800,3200);if(ctx)draw(0);
  window.addEventListener('resize',function(){size();layoutLetters();if(reduced)draw(0);});

   splitTitle();var fontReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(resolve){setTimeout(resolve,900);})]):Promise.resolve();fontReady.then(function(){layoutLetters();typeTitle();});
   var eyes=document.querySelectorAll('#lEyes rect'), mascot=document.querySelector('.l-mascot');

(function(){
  var svg=document.querySelector('.mascot svg');
  if(!svg)return;
  var eyes=Array.from(svg.querySelectorAll('g rect'));
  if(eyes.length<2)return;
  var bases=eyes.map(function(el){return {el:el,x:parseFloat(el.getAttribute('x')),y:parseFloat(el.getAttribute('y')),h:parseFloat(el.getAttribute('height'))};});
  window.addEventListener('pointermove',function(ev){
    var r=svg.getBoundingClientRect();
    var px=((ev.clientX-r.left)/r.width-.5)*2;
    var py=((ev.clientY-r.top)/r.height-.5)*2;
    bases.forEach(function(b){b.el.setAttribute('x',(b.x+Math.max(-1,Math.min(1,px))*2.1).toFixed(2));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,py))*1.8).toFixed(2));});
  },{passive:true});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    function blink(){
      bases.forEach(function(b){b.el.setAttribute('height','2');b.el.setAttribute('y',(parseFloat(b.el.getAttribute('y'))+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,((window.innerHeight/2)-b.y)/window.innerHeight))*0).toFixed(2));});},130);
    }
    function restore(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));});}
    window.setInterval(function(){
      var ys=bases.map(function(b){return parseFloat(b.el.getAttribute('y'));});
      bases.forEach(function(b,i){b.el.setAttribute('height','2');b.el.setAttribute('y',(ys[i]+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b,i){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',ys[i].toFixed(2));});},135);
    },3600);
  }
})();

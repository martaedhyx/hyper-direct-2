<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101f">
<meta name="application-name" content="Hyper Direct">
<meta name="apple-mobile-web-app-title" content="Hyper Direct">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">
<link rel="apple-touch-icon" href="./icon.svg?v=2">
<link rel="manifest" href="./manifest.webmanifest">
<meta http-equiv="Cache-Control" content="no-store">
<title>Hyper Direct</title>
<style>
:root{color-scheme:dark;--bg:#06101f;--panel:#0d1b30;--panel2:#10233b;--line:#1b4260;--cyan:#39e7ff;--blue:#318bff;--muted:#9ab6cc;--white:#edfaff}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:radial-gradient(ellipse at 50% -10%,#123e68 0%,#09182b 42%,var(--bg) 78%);background-attachment:fixed;color:var(--white);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:28px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mascot{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 6px #0008) drop-shadow(0 0 8px #39e7ff22)}.mascot svg{width:100%;height:100%;display:block;overflow:visible}.mascot svg g.hd-eye rect{transition:x .12s ease,y .12s ease,height .09s ease}.brand-title{font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:-1.1px;line-height:1.1;background:linear-gradient(90deg,#f3fdff 0%,var(--cyan) 48%,#78aaff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #39e7ff22}
.tagline{margin:7px 0 24px;color:var(--muted);font-size:14px;line-height:1.65}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10233bea,#09172bed);border-radius:20px;padding:19px;margin-top:14px;border:1px solid var(--line);box-shadow:0 12px 35px #00000030}
.menu-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;margin-top:14px}
.menu-layout>.card{margin-top:0;min-width:0;padding:16px}
.menu-layout .code{font-size:clamp(17px,4vw,28px);letter-spacing:clamp(2px,1vw,6px);padding:14px 5px}
.menu-layout .small{font-size:12px}
.menu-layout .send-card{grid-column:1 / -1;width:min(100%,440px);justify-self:center}
.menu-layout button,.menu-layout input{min-width:0}
@media(max-width:390px){.menu-layout{gap:8px}.menu-layout>.card{padding:12px}.menu-layout .step{font-size:9px;letter-spacing:1px}.menu-layout button{padding:11px 7px;font-size:13px}.menu-layout .code{letter-spacing:2px;font-size:17px}}
@media(min-width:520px){.menu-layout>.card{padding:20px}}

.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent);opacity:.8}
.card h3{margin:0 0 8px}
.step{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan)}
.small{font-size:13px;color:var(--muted);line-height:1.65}
.code{text-align:center;font-size:clamp(27px,7vw,34px);font-weight:900;letter-spacing:7px;padding:16px 12px;background:linear-gradient(135deg,#071628,#102b46);border:1px solid #246486;border-radius:15px;margin-top:13px;color:#a5f6ff;text-shadow:0 0 18px #39e7ff55;box-shadow:inset 0 0 22px #39e7ff0b}
.status{padding:13px 14px;border-radius:13px;background:#081729;border:1px solid #193b56;margin-top:12px;color:#d3eaf7;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.status.connected{color:#8dffb0;background:rgba(25,255,112,.10);border:1px solid #39ff83;box-shadow:0 0 10px rgba(35,255,112,.22),inset 0 0 12px rgba(35,255,112,.06);font-weight:800;text-shadow:0 0 8px rgba(57,255,131,.28)}
.status.connected::before{content:"✓ ";display:inline-block;color:#39ff83;font-weight:900}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #27506d;font:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button{background:linear-gradient(100deg,#1677e8,#12bdd8);color:#031322;border:1px solid #52eaff;font-weight:850;margin-top:9px;box-shadow:0 5px 18px #0bbbd52a;cursor:pointer}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:hover{box-shadow:0 0 22px #39e7ff40}
input{background:#071629;color:var(--white)}
input::placeholder{color:#7192aa}
input[type=file]{background:#09192b;color:var(--muted);font-size:13px}
input[type=text]{text-transform:uppercase}
.files{margin-top:10px;display:grid;gap:8px}
.fileitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:#0b1c2f;border:1px solid #1d4c69;border-radius:12px}
.fileitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5f8ff}
.fileitem a{font-weight:800;color:var(--cyan);text-decoration:none;white-space:nowrap}
@media(min-width:520px){.wrap{padding-top:36px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
/* Landing page Hyper Direct 1 — branding dan maskot asli */
.landing{position:fixed;inset:0;z-index:1000;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);background:radial-gradient(120% 70% at 50% 0%,#0f1d3d 0%,#070b18 55%,#04060d 100%);transition:opacity .45s ease,transform .45s ease}
.landing.out{opacity:0;transform:scale(1.04);pointer-events:none}
.stars,.stars2{position:absolute;inset:-20px;pointer-events:none;background-repeat:repeat}
.stars{background-size:220px 220px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 60px 120px,#e6f6ff,transparent),radial-gradient(2px 2px at 140px 60px,#fff,transparent),radial-gradient(1.4px 1.4px at 180px 170px,#cff,transparent),radial-gradient(1.8px 1.8px at 100px 200px,#fff,transparent);animation:twinkle 4.5s ease-in-out infinite,starDriftOne 38s linear infinite;will-change:background-position,opacity}
.stars2{background-size:160px 160px;background-image:radial-gradient(1px 1px at 10px 90px,#fff,transparent),radial-gradient(1px 1px at 80px 20px,#bdf,transparent),radial-gradient(1.2px 1.2px at 130px 130px,#fff,transparent),radial-gradient(1px 1px at 50px 150px,#cff,transparent);animation:twinkle 3.2s ease-in-out infinite reverse,starDriftTwo 52s linear infinite;opacity:.7;will-change:background-position,opacity}
@keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.35}}
@keyframes starDriftOne{from{background-position:0 0}to{background-position:220px 440px}}
@keyframes starDriftTwo{from{background-position:0 0}to{background-position:-320px 160px}}
.l-glow{position:absolute;width:520px;height:520px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.13),transparent 62%);pointer-events:none}
.l-mascot{position:relative;width:clamp(132px,40vw,184px);height:clamp(132px,40vw,184px);animation:lfloat 4.2s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(34,211,238,.25))}
.l-mascot svg{width:100%;height:100%;display:block;overflow:visible}
.l-mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.l-shadow{width:clamp(72px,22vw,104px);height:12px;margin:10px auto 0;border-radius:50%;background:rgba(34,211,238,.35);filter:blur(7px);animation:lshadow 4.2s ease-in-out infinite}
@keyframes lshadow{0%,100%{transform:scaleX(1);opacity:.65}50%{transform:scaleX(.7);opacity:.32}}
.l-title{position:relative;margin:30px 0 10px;font-family:'Orbitron','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(2.15rem,11.2vw,4.6rem);line-height:1.1;letter-spacing:.04em;background:linear-gradient(90deg,#22d3ee 0%,#38bdf8 45%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(6,182,212,.55))}
.l-title span{display:inline-block}
.l-tag{position:relative;color:rgba(165,243,252,.8);font-size:12px;letter-spacing:.32em;font-weight:600;margin:0 0 44px;padding-left:.32em}
.l-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto;padding:15px 38px;border-radius:999px;border:1.5px solid rgba(34,211,238,.75);background:linear-gradient(135deg,#22d3ee,#2563eb);color:#061322;font-weight:800;font-size:15px;letter-spacing:.18em;box-shadow:0 12px 34px -10px rgba(34,211,238,.78);transition:transform .15s,opacity .2s}
.l-btn:active{transform:scale(.96)}
.l-foot{position:relative;margin-top:24px;color:rgba(148,163,184,.72);font-size:10px;letter-spacing:.16em}
@media(max-height:620px){.l-mascot{width:clamp(100px,25vh,150px);height:clamp(100px,25vh,150px)}.l-title{margin-top:18px;font-size:clamp(2rem,8vh,3.2rem)}.l-tag{margin-bottom:24px}.l-foot{margin-top:16px}}

</style>
</head>
<body>

<section class="landing" id="landing" aria-label="Hyper Direct">
  <div class="stars"></div><div class="stars2"></div><div class="l-glow"></div>
  <div class="l-mascot" role="img" aria-label="Maskot Hyper Direct">
    <svg viewBox="0 0 100 100" focusable="false">
      <defs>
        <radialGradient id="mg2" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eef1f6"/><stop offset=".82" stop-color="#cfd5de"/><stop offset="1" stop-color="#aeb6c2"/></radialGradient>
        <clipPath id="mc2"><circle cx="50" cy="50" r="47.5"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="49" fill="url(#mg2)"/>
      <circle cx="50" cy="50" r="48.4" fill="none" stroke="rgba(15,23,42,.12)" stroke-width="1.2"/>
      <ellipse cx="30" cy="24" rx="15" ry="7" fill="#fff" opacity=".9" transform="rotate(-35 30 24)"/>
      <g clip-path="url(#mc2)">
        <g id="lCheeks"><ellipse cx="53" cy="47" rx="6" ry="3.2" fill="#ff8fb1" opacity=".5" transform="rotate(-25 53 47)"/>
        <ellipse cx="86" cy="42" rx="5" ry="2.8" fill="#ff8fb1" opacity=".5" transform="rotate(-25 86 42)"/></g>
        <g id="lEyes"><g transform="rotate(-25 60 30.5)"><rect class="m-eye" x="55" y="21" width="10" height="19" rx="5" fill="#111318"/></g>
        <g transform="rotate(-25 80 26.5)"><rect class="m-eye" x="75.75" y="17.5" width="8.5" height="18" rx="4.25" fill="#111318"/></g></g>
      </g>
    </svg>
  </div>
  <div class="l-shadow"></div>
  <h1 class="l-title" aria-label="HYPER DIRECT"><span>HYPER</span> <span>DIRECT</span></h1>
  <p class="l-tag">BERBAGI FOTO HD LANGSUNG</p>
  <button type="button" class="l-btn" id="startBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>MULAI</button>
  <div class="l-foot">P2P · kualitas asli · tanpa server</div>
</section>
<script>
(function(){
  var b=document.getElementById('startBtn'),l=document.getElementById('landing');
  if(b&&l)b.addEventListener('click',function(){l.classList.add('out');window.setTimeout(function(){l.style.display='none';},460);});
})();
</script>

<div class="wrap">
<div class="brand">
  <div class="mascot" aria-hidden="true">
    <svg viewBox="0 0 100 100" focusable="false">
      <defs>
        <radialGradient id="hdMascotGradient" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eef1f6"/><stop offset=".82" stop-color="#cfd5de"/><stop offset="1" stop-color="#aeb6c2"/></radialGradient>
        <clipPath id="hdMascotClip"><circle cx="50" cy="50" r="47.5"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="49" fill="url(#hdMascotGradient)"/>
      <circle cx="50" cy="50" r="48.4" fill="none" stroke="rgba(15,23,42,.12)" stroke-width="1.2"/>
      <ellipse cx="30" cy="24" rx="15" ry="7" fill="#fff" opacity=".9" transform="rotate(-35 30 24)"/>
      <g clip-path="url(#hdMascotClip)">
        <ellipse cx="53" cy="47" rx="6" ry="3.2" fill="#ff8fb1" opacity=".5" transform="rotate(-25 53 47)"/>
        <ellipse cx="86" cy="42" rx="5" ry="2.8" fill="#ff8fb1" opacity=".5" transform="rotate(-25 86 42)"/>
        <g transform="rotate(-25 60 30.5)"><rect x="55" y="21" width="10" height="19" rx="5" fill="#111318"/></g>
        <g transform="rotate(-25 80 26.5)"><rect x="75.75" y="17.5" width="8.5" height="18" rx="4.25" fill="#111318"/></g>
      </g>
    </svg>
  </div>
  <div class="brand-title">Hyper Direct</div>
</div>
<p class="small tagline">Kirim foto & file jarak jauh.</p>

<div class="menu-layout">
<div class="card">
<div class="step">1 • BUAT ROOM</div>
<button type="button" onclick="window.hdCreateRoom()">Buat Room</button>
<div id="code" class="code">---</div>
<div id="status" class="status">Belum terhubung.</div>
<p class="small">Bagikan kode room 3 digit di atas ke teman.</p>
</div>

<div class="card">
<div class="step">2 • MASUK ROOM</div>
<input id="join" type="text" maxlength="3" inputmode="numeric" pattern="[0-9]{3}" placeholder="Kode 3 digit" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.replace(/\D/g,'').slice(0,3)">
<button type="button" onclick="window.hdJoinRoom()">Masuk Room</button>
</div>

<div class="card send-card">
<div class="step">3 • KIRIM FILE</div>
<input id="file" type="file">
<button type="button" onclick="window.hdSendFile()">Kirim File</button>
<div id="transfer" class="status">Belum ada file dikirim.</div>
<div id="files" class="files"></div>
</div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Hyper Direct mascot: mata mengikuti pointer dan berkedip */ 
(function(){
  var svg=document.querySelector('.mascot svg');
  if(!svg)return;
  var eyes=Array.from(svg.querySelectorAll('g rect'));
  if(eyes.length<2)return;
  var bases=eyes.map(function(el){return {el:el,x:parseFloat(el.getAttribute('x')),y:parseFloat(el.getAttribute('y')),h:parseFloat(el.getAttribute('height'))};});
  window.addEventListener('pointermove',function(ev){
    var r=svg.getBoundingClientRect();
    var px=((ev.clientX-r.left)/r.width-.5)*2;
    var py=((ev.clientY-r.top)/r.height-.5)*2;
    bases.forEach(function(b){b.el.setAttribute('x',(b.x+Math.max(-1,Math.min(1,px))*2.1).toFixed(2));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,py))*1.8).toFixed(2));});
  },{passive:true});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    function blink(){
      bases.forEach(function(b){b.el.setAttribute('height','2');b.el.setAttribute('y',(parseFloat(b.el.getAttribute('y'))+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,((window.innerHeight/2)-b.y)/window.innerHeight))*0).toFixed(2));});},130);
    }
    function restore(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));});}
    window.setInterval(function(){
      var ys=bases.map(function(b){return parseFloat(b.el.getAttribute('y'));});
      bases.forEach(function(b,i){b.el.setAttribute('height','2');b.el.setAttribute('y',(ys[i]+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b,i){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',ys[i].toFixed(2));});},135);
    },3600);
  }
})();
window.hdPeer=null;window.hdConn=null;window.hdMeta=null;window.hdParts=[];window.hdReceived=0;window.hdWaiting=null;
function hdStatus(t){var el=document.getElementById('status');var connected=/terhubung/i.test(t)&&!/belum terhubung/i.test(t)&&!/tidak terhubung/i.test(t)&&!/terputus/i.test(t);el.classList.toggle('connected',connected);el.textContent=String(t).replace(/^TERHUBUNG\s*✓?$/i,'TERHUBUNG')}
function hdTransfer(t){document.getElementById('transfer').textContent=t}
function hdCode(){return String(Math.floor(Math.random()*1000)).padStart(3,'0')}
window.hdCreateRoom=function(){var c=hdCode();document.getElementById('code').textContent=c;hdStatus('Membuka room...');if(typeof Peer==='undefined'){hdStatus('Kode sudah dibuat. Koneksi belum siap.');return}if(window.hdPeer){try{window.hdPeer.destroy()}catch(e){}}window.hdPeer=new Peer(c,{debug:0});window.hdPeer.on('open',function(){hdStatus('Room siap. Tunggu perangkat kedua...')});window.hdPeer.on('connection',hdBind);window.hdPeer.on('error',function(e){hdStatus('Room gagal: '+(e.type||'error'))})};
window.hdJoinRoom=function(){var c=document.getElementById('join').value.trim().toUpperCase();if(!/^\d{3}$/.test(c)){hdStatus('Masukkan kode room 3 digit.');return}if(typeof Peer==='undefined'){hdStatus('Koneksi belum siap.');return}if(window.hdPeer){try{window.hdPeer.destroy()}catch(e){}}hdStatus('Menghubungkan...');window.hdPeer=new Peer(undefined,{debug:0});window.hdPeer.on('open',function(){window.hdConn=window.hdPeer.connect(c,{reliable:true});hdBind(window.hdConn)});window.hdPeer.on('error',function(e){hdStatus('Koneksi gagal: '+(e.type||'error'))})};
function hdBind(c){window.hdConn=c;c.on('open',function(){hdStatus('TERHUBUNG ✓')});c.on('close',function(){hdStatus('Koneksi terputus.')});c.on('error',function(){hdStatus('Koneksi bermasalah.')});c.on('data',function(data){if(data&&data.kind==='file-start'){window.hdMeta=data;window.hdParts=[];window.hdReceived=0;hdTransfer('Menerima '+data.name+' (0%)...');return}if(data&&data.kind==='ack'){window.hdWaiting=Math.max(window.hdWaiting||0,data.n);return}if(window.hdMeta&&(data instanceof ArrayBuffer||ArrayBuffer.isView(data))){var u=data instanceof ArrayBuffer?new Uint8Array(data):new Uint8Array(data.buffer,data.byteOffset,data.byteLength);window.hdParts.push(u.slice());window.hdReceived+=u.byteLength;hdTransfer('Menerima '+Math.round(window.hdReceived/window.hdMeta.size*100)+'%...');c.send({kind:'ack',n:window.hdReceived});return}if(data&&data.kind==='file-end'&&window.hdMeta){var meta=window.hdMeta;var blob=new Blob(window.hdParts,{type:meta.type||'application/octet-stream'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=meta.name;a.textContent='⬇ Simpan';var item=document.createElement('div');item.className='fileitem';var label=document.createElement('span');label.textContent=meta.name;item.appendChild(label);item.appendChild(a);document.getElementById('files').prepend(item);hdTransfer('File diterima ✓');window.hdMeta=null;window.hdParts=[];window.hdReceived=0}})}
window.hdSendFile=async function(){var f=document.getElementById('file').files[0];if(!f){hdTransfer('Pilih foto/file dulu.');return}if(!window.hdConn||!window.hdConn.open){hdTransfer('Belum terhubung.');return}window.hdWaiting=0;window.hdConn.send({kind:'file-start',name:f.name,size:f.size,type:f.type});var pos=0,size=1048576,windowBytes=4*size;while(pos<f.size){var batchEnd=Math.min(pos+windowBytes,f.size);while(pos<batchEnd){var b=await f.slice(pos,Math.min(pos+size,batchEnd)).arrayBuffer();window.hdConn.send(b);pos+=b.byteLength;hdTransfer('Mengirim '+Math.round(pos/f.size*100)+'%')}var start=Date.now();while((window.hdWaiting||0)<batchEnd){if(Date.now()-start>15000){hdTransfer('Koneksi berhenti merespons.');return}await new Promise(function(r){setTimeout(r,10)})}}window.hdConn.send({kind:'file-end'});hdTransfer('File terkirim ✓')};
</script>
</body>
</html>

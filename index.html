<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101f">
<meta name="application-name" content="Hyper Direct">
<meta name="apple-mobile-web-app-title" content="Hyper Direct">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">
<link rel="apple-touch-icon" href="./icon.svg?v=2">
<link rel="manifest" href="./manifest.webmanifest">

<title>Hyper Direct</title>
<style>
:root{color-scheme:dark;--bg:#06101f;--panel:#0d1b30;--panel2:#10233b;--line:#1b4260;--cyan:#39e7ff;--blue:#318bff;--muted:#9ab6cc;--white:#edfaff}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:radial-gradient(ellipse at 50% -10%,#123e68 0%,#09182b 42%,var(--bg) 78%);background-attachment:fixed;color:var(--white);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:28px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mascot{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 6px #0008) drop-shadow(0 0 11px #39e7ff42);animation:hdBotFloat 3.8s ease-in-out infinite}.mascot svg{transform-origin:50% 50%}.mascot:hover{filter:drop-shadow(0 3px 6px #0008) drop-shadow(0 0 16px #39e7ff88)}@keyframes hdBotFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}.mascot svg{width:100%;height:100%;display:block;overflow:visible}.mascot svg g.hd-eye rect{transition:x .12s ease,y .12s ease,height .09s ease}.brand-title{font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:-1.1px;line-height:1.1;background:linear-gradient(90deg,#f3fdff 0%,var(--cyan) 48%,#78aaff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #39e7ff22}
.tagline{margin:7px 0 24px;color:var(--muted);font-size:14px;line-height:1.65}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10233bea,#09172bed);border-radius:20px;padding:19px;margin-top:14px;border:1px solid var(--line);box-shadow:0 12px 35px #00000030}
.menu-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;margin-top:14px}
.menu-layout>.card{margin-top:0;min-width:0;padding:16px}
.menu-layout .code{font-size:clamp(17px,4vw,28px);letter-spacing:clamp(2px,1vw,6px);padding:14px 5px}
.menu-layout .small{font-size:12px}
.menu-layout .send-card{grid-column:1 / -1;width:min(100%,440px);justify-self:center}
.menu-layout button,.menu-layout input{min-width:0}
@media(max-width:390px){.menu-layout{gap:8px}.menu-layout>.card{padding:12px}.menu-layout .step{font-size:9px;letter-spacing:1px}.menu-layout button{padding:11px 7px;font-size:13px}.menu-layout .code{letter-spacing:2px;font-size:17px}}
@media(min-width:520px){.menu-layout>.card{padding:20px}}

.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent);opacity:.8}
.card h3{margin:0 0 8px}
.step{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan)}
.small{font-size:13px;color:var(--muted);line-height:1.65}
.code{text-align:center;font-size:clamp(27px,7vw,34px);font-weight:900;letter-spacing:7px;padding:16px 12px;background:linear-gradient(135deg,#071628,#102b46);border:1px solid #246486;border-radius:15px;margin-top:13px;color:#a5f6ff;text-shadow:0 0 18px #39e7ff55;box-shadow:inset 0 0 22px #39e7ff0b}
.status{padding:13px 14px;border-radius:13px;background:#081729;border:1px solid #193b56;margin-top:12px;color:#d3eaf7;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.status.connected{color:#8dffb0;background:rgba(25,255,112,.10);border:1px solid #39ff83;box-shadow:0 0 10px rgba(35,255,112,.22),inset 0 0 12px rgba(35,255,112,.06);font-weight:800;text-shadow:0 0 8px rgba(57,255,131,.28)}
.status.connected::before{content:"✓ ";display:inline-block;color:#39ff83;font-weight:900}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #27506d;font:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button{background:linear-gradient(100deg,#1677e8,#12bdd8);color:#031322;border:1px solid #52eaff;font-weight:850;margin-top:9px;box-shadow:0 5px 18px #0bbbd52a;cursor:pointer}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:hover{box-shadow:0 0 22px #39e7ff40}
input{background:#071629;color:var(--white)}
input::placeholder{color:#7192aa}
input[type=file]{background:#09192b;color:var(--muted);font-size:13px}
input[type=text]{text-transform:uppercase}
.files{margin-top:14px;display:grid;gap:12px}
.files:empty:after{content:"File yang diterima akan tampil di sini";display:block;padding:18px 14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #27506d;border-radius:14px;background:#07162980}
.fileitem{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:14px;background:linear-gradient(150deg,#10243a,#091729);border:1px solid #27506d;border-radius:16px;min-width:0;box-shadow:0 8px 22px #00000020}
.fileitem .file-name{display:flex;align-items:center;gap:9px;min-width:0;font-weight:750;color:#e5f8ff;overflow-wrap:anywhere;line-height:1.4}
.fileitem .file-name:before{content:"FILE";flex:none;font-size:10px;letter-spacing:1px;color:var(--cyan);padding:5px 7px;border-radius:7px;background:#39e7ff14;border:1px solid #27506d}
.file-preview{display:grid;place-items:center;min-height:44px;max-height:340px;overflow:hidden;background:#050d18;border:1px solid #1d3d56;border-radius:12px}
.file-preview img,.file-preview video{display:block;width:100%;max-height:320px;object-fit:contain;background:#050d18}
.file-preview audio{width:100%;padding:10px;max-width:100%}
.file-preview .preview-note{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.file-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fileitem a.download-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 15px;border-radius:11px;background:linear-gradient(100deg,#1677e8,#12bdd8);border:1px solid #52eaff;color:#031322;font-weight:850;text-decoration:none;white-space:nowrap}
.fileitem a.download-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.file-size{margin-right:auto;color:var(--muted);font-size:12px}
@media(min-width:520px){.wrap{padding-top:36px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
/* Landing page Hyper Direct 1 — branding dan maskot asli */
.landing{position:fixed;inset:0;z-index:1000;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);background:radial-gradient(120% 70% at 50% 0%,#0f1d3d 0%,#070b18 55%,#04060d 100%);transition:opacity .45s ease,transform .45s ease}
.landing.out{opacity:0;transform:scale(1.04);pointer-events:none}
.stars,.stars2{position:absolute;inset:-20px;pointer-events:none;background-repeat:repeat}
.stars{background-size:220px 220px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 60px 120px,#e6f6ff,transparent),radial-gradient(2px 2px at 140px 60px,#fff,transparent),radial-gradient(1.4px 1.4px at 180px 170px,#cff,transparent),radial-gradient(1.8px 1.8px at 100px 200px,#fff,transparent);animation:twinkle 4.5s ease-in-out infinite,starDriftOne 38s linear infinite;will-change:background-position,opacity}
.stars2{background-size:160px 160px;background-image:radial-gradient(1px 1px at 10px 90px,#fff,transparent),radial-gradient(1px 1px at 80px 20px,#bdf,transparent),radial-gradient(1.2px 1.2px at 130px 130px,#fff,transparent),radial-gradient(1px 1px at 50px 150px,#cff,transparent);animation:twinkle 3.2s ease-in-out infinite reverse,starDriftTwo 52s linear infinite;opacity:.7;will-change:background-position,opacity}
@keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.35}}
@keyframes starDriftOne{from{background-position:0 0}to{background-position:220px 440px}}
@keyframes starDriftTwo{from{background-position:0 0}to{background-position:-320px 160px}}
.l-glow{position:absolute;width:520px;height:520px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.13),transparent 62%);pointer-events:none}
.l-canvas{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.l-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95) 0%,rgba(165,243,252,.55) 22%,rgba(14,116,144,0) 62%)}
.l-mascot{position:relative;width:clamp(106px,32vw,147px);height:clamp(106px,32vw,147px);animation:lfloat 4.2s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(34,211,238,.25))}
.l-mascot svg{width:100%;height:100%;display:block;overflow:visible}
.l-mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.l-mascot svg{filter:drop-shadow(0 0 12px #39e7ff22)}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.l-shadow{width:clamp(72px,22vw,104px);height:12px;margin:10px auto 0;border-radius:50%;background:rgba(34,211,238,.35);filter:blur(7px);animation:lshadow 4.2s ease-in-out infinite}
@keyframes lshadow{0%,100%{transform:scaleX(1);opacity:.65}50%{transform:scaleX(.7);opacity:.32}}
.l-title{position:relative;margin:30px 0 10px;font-family:'Orbitron','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(2.8rem,14.56vw,6rem);line-height:1.1;letter-spacing:.04em;background:linear-gradient(90deg,#22d3ee 0%,#38bdf8 45%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(6,182,212,.55))}
.l-title span{display:inline-block}
.l-tag{position:relative;color:rgba(165,243,252,.8);font-size:12px;letter-spacing:.32em;font-weight:600;margin:0 0 44px;padding-left:.32em}
.l-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto;padding:15px 38px;border-radius:999px;border:1.5px solid rgba(34,211,238,.75);background:linear-gradient(135deg,#22d3ee,#2563eb);color:#061322;font-weight:800;font-size:15px;letter-spacing:.18em;box-shadow:0 12px 34px -10px rgba(34,211,238,.78);transition:transform .15s,opacity .2s}
.l-btn:active{transform:scale(.96)}
.l-foot{position:relative;margin-top:24px;color:rgba(148,163,184,.72);font-size:10px;letter-spacing:.16em}
@media(max-height:620px){.l-mascot{width:clamp(80px,20vh,120px);height:clamp(80px,20vh,120px)}.l-title{margin-top:18px;font-size:clamp(2.6rem,10.4vh,4.16rem)}.l-tag{margin-bottom:24px}.l-foot{margin-top:16px}}


/* Visual-only menu refresh: backup is available in Git history. Transfer logic untouched. */
.wrap{max-width:820px;padding:24px 18px 42px}
.brand{padding:4px 2px 18px;border-bottom:1px solid #17374e;gap:14px}
.mascot{width:58px;height:58px}
.brand-title{font-size:clamp(30px,7vw,42px);letter-spacing:-1.25px}
.tagline{font-size:15px;margin:10px 0 20px}
.menu-layout{gap:14px;margin-top:18px}
.menu-layout>.card{padding:20px;border-radius:26px;border:1px solid #203d6b;background:linear-gradient(145deg,#14233d 0%,#101b30 70%,#0d192b 100%);box-shadow:0 12px 28px #0002}
.menu-layout>.card:before{display:none}
.menu-layout .step{font-size:12px;letter-spacing:2px;color:#8d9db6}
.menu-layout .code{font-size:clamp(30px,8vw,42px);letter-spacing:8px;border:0;background:transparent;box-shadow:none;text-align:left;padding:6px 0 12px;color:#f0f6ff;text-shadow:none}
.menu-layout button{min-height:52px;margin-top:12px;border:1px solid #243553;border-radius:16px;background:#1a2944;color:#e7f0ff;box-shadow:none;font-weight:800;padding:14px 16px}
.menu-layout button:hover{background:#213653;box-shadow:0 0 0 1px #39e7ff30}
.menu-layout button:active{transform:scale(.985)}
.menu-layout input[type=text]{min-height:52px;border:1px solid #243553;border-radius:16px;background:#0b1729;padding:14px 16px;font-size:18px}
.menu-layout input[type=file]{border:1px dashed #168ea7;border-radius:20px;background:#0f2b40;padding:16px;color:#c4d4e8}
.menu-layout .status{border:0;border-radius:16px;background:#173148;padding:13px 15px;color:#cbd9e9}
.menu-layout .status.connected{background:#12392f;border:1px solid #216e56;color:#6df0ba;box-shadow:none;text-shadow:none}
.menu-layout .small{font-size:14px;line-height:1.6}
.menu-layout .send-card{width:100%;justify-self:stretch}
.menu-layout .send-card>button{background:linear-gradient(110deg,#21cde5,#388bff);border:0;color:#071528}
.files{gap:14px;margin-top:16px}
.files:empty:after{content:"Belum ada file.\A Pilih Foto / Video, atau tunggu kiriman teman — file yang diterima muncul di sini.";white-space:pre-line;padding:30px 18px;min-height:150px;display:flex;align-items:center;justify-content:center;border:1px dashed #263a5c;border-radius:24px;background:#142039;color:#91a0b8;font-size:15px;line-height:1.65}
.fileitem{padding:16px;border:1px solid #243d67;border-radius:22px;background:#142039;box-shadow:none}
.fileitem .file-name:before{content:"FILE";border-radius:9px;background:#173b50;border-color:#22516c}
.file-preview{border-radius:16px;border-color:#243b5c;background:#071222;min-height:60px}
.file-preview img,.file-preview video{max-height:420px}
.fileitem a.download-btn{min-height:46px;border:0;border-radius:14px;background:linear-gradient(110deg,#21cde5,#388bff);color:#061526;box-shadow:none}
@media(max-width:430px){
 .wrap{padding:18px 14px 34px}
 .brand{gap:12px;padding-bottom:16px}
 .mascot{width:50px;height:50px}
 .menu-layout{gap:10px}
 .menu-layout>.card{padding:15px;border-radius:22px}
 .menu-layout .step{font-size:10px;letter-spacing:1.2px}
 .menu-layout button{font-size:14px;padding:13px 9px;min-height:48px}
 .menu-layout .code{font-size:29px;letter-spacing:5px}
 .menu-layout .small{font-size:12px}
 .files:empty:after{font-size:14px}
}

</style>
</head>
<body>

<section class="landing" id="landing" aria-label="Hyper Direct">
  <div class="stars"></div><div class="stars2"></div><canvas class="l-canvas" id="lCanvas" aria-hidden="true"></canvas><div class="l-glow"></div><div class="l-flash" aria-hidden="true"></div>
  <div class="l-mascot" role="img" aria-label="Maskot futuristik Hyper Direct">
    <svg viewBox="0 0 100 100" focusable="false">
      <defs>
        <radialGradient id="mg2" cx="32%" cy="22%" r="82%"><stop offset="0" stop-color="#344b66"/><stop offset=".42" stop-color="#14243a"/><stop offset="1" stop-color="#050a13"/></radialGradient>
        <linearGradient id="mRing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7df5ff"/><stop offset=".52" stop-color="#278cff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient>
        <clipPath id="mc2"><circle cx="50" cy="50" r="46"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#mg2)" stroke="url(#mRing)" stroke-width="2.5"/>
      <ellipse cx="35" cy="19" rx="19" ry="7" fill="#b9f8ff" opacity=".12" transform="rotate(-25 35 19)"/>
      <circle cx="50" cy="50" r="37" fill="none" stroke="#5eeaff" stroke-opacity=".23" stroke-width="1.4" stroke-dasharray="22 10 7 12" transform="rotate(-28 50 50)"/>
      <g clip-path="url(#mc2)">
        <path d="M17 53 Q50 20 83 53" fill="none" stroke="#4deaff" stroke-opacity=".24" stroke-width="2"/>
        <g id="lEyes"><g><rect class="m-eye" x="29" y="37" width="12" height="23" rx="6" fill="#8ffaff"/></g><g><rect class="m-eye" x="59" y="37" width="12" height="23" rx="6" fill="#8ffaff"/></g></g>
        <path d="M39 70 Q50 76 61 70" fill="none" stroke="#55eaff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      </g>
      <circle cx="50" cy="50" r="47" fill="none" stroke="#d9fdff" stroke-opacity=".22"/>
    </svg>
  </div>
  <div class="l-shadow"></div>
  <h1 class="l-title" id="lTitle" aria-label="HYPER DIRECT"><span class="w">HYPER</span> <span class="w">DIRECT</span></h1>
  <p class="l-tag">NEXT IS NOW</p>
  <button type="button" class="l-btn" id="startBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>MULAI</button>
  <div class="l-foot">P2P · kualitas asli · tanpa server</div>
</section>
<script>
(function(){
  var b=document.getElementById('startBtn'),l=document.getElementById('landing');
  if(b&&l)b.addEventListener('click',function(){l.classList.add('out');window.setTimeout(function(){l.style.display='none';},460);});
})();
</script>

<div class="wrap">
<div class="brand">
  <div class="mascot" aria-hidden="true">
    <svg viewBox="0 0 100 100" focusable="false">
      <defs>
        <radialGradient id="hdMascotGradient" cx="32%" cy="22%" r="82%"><stop offset="0" stop-color="#344b66"/><stop offset=".42" stop-color="#14243a"/><stop offset="1" stop-color="#050a13"/></radialGradient>
        <linearGradient id="hdRing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7df5ff"/><stop offset=".52" stop-color="#278cff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient>
        <clipPath id="hdMascotClip"><circle cx="50" cy="50" r="46"/></clipPath>

<p class="small tagline">Kirim foto & file jarak jauh.</p>

<div class="menu-layout">
<div class="card">
<div class="step">1 • BUAT ROOM</div>
<button type="button" onclick="window.hdCreateRoom()">Buat Room</button>

<div id="status" class="status">Belum terhubung.</div>
<p class="small">Bagikan kode room 3 digit di atas ke teman.</p>
</div>

<div class="card">
<div class="step">2 • MASUK ROOM</div>
<input id="join" type="text" maxlength="3" inputmode="numeric" pattern="[0-9]{3}" placeholder="Kode 3 digit" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.replace(/\D/g,'').slice(0,3)">
<button type="button" onclick="window.hdJoinRoom()">Masuk Room</button>
</div>

<div class="card send-card">
<div class="step">3 • KIRIM FILE</div>
<input id="file" type="file">
<button type="button" onclick="window.hdSendFile()">Kirim File</button>

<div id="files" class="files"></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Hyper Direct mascot: mata mengikuti pointer dan berkedip */ 
(function(){
  var svg=document.querySelector('.mascot svg');
  if(!svg)return;
  var eyes=Array.from(svg.querySelectorAll('g rect'));
  if(eyes.length<2)return;
  var bases=eyes.map(function(el){return {el:el,x:parseFloat(el.getAttribute('x')),y:parseFloat(el.getAttribute('y')),h:parseFloat(el.getAttribute('height'))};});
  window.addEventListener('pointermove',function(ev){
    var r=svg.getBoundingClientRect();

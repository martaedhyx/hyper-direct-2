<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyper Direct 2</title>
<style>
body{font-family:system-ui;margin:0;background:#fff7f0;color:#222}.wrap{max-width:560px;margin:auto;padding:24px 16px}.brand{font-size:30px;font-weight:800;color:#f26a21}.card{background:white;border-radius:18px;padding:18px;margin-top:14px;border:1px solid #eadfd8}button,input{width:100%;padding:13px;border-radius:12px;border:1px solid #d8ccc5;font:inherit;box-sizing:border-box}button{background:#f26a21;color:white;border:0;font-weight:700;margin-top:10px}.code{text-align:center;font-size:28px;font-weight:800;letter-spacing:5px;padding:12px;background:#fff3ea;border-radius:12px;margin-top:12px}.status{padding:12px;border-radius:12px;background:#f5f2ef;margin-top:12px}.small{font-size:13px;color:#756b65;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">Hyper Direct 2</div>
<p class="small">Versi uji cepat — fokus membuat dua perangkat mudah terhubung.</p>
<div class="card">
<h3>Buat room</h3>
<button id="create">Buat Room</button>
<div id="code" class="code">------</div>
<p class="small">Bagikan kode room ini kepada teman. Fitur transfer file akan diaktifkan setelah jalur koneksi berhasil diuji.</p>
</div>
<div class="card">
<h3>Masuk ke room</h3>
<input id="join" maxlength="6" placeholder="Masukkan kode room">
<button id="connect">Hubungkan</button>
<div id="status" class="status">Belum terhubung.</div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const code=document.getElementById('code'),status=document.getElementById('status');
let peer=null,conn=null;
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function setStatus(t){status.textContent=t}
function startHost(c){
  if(peer) peer.destroy();
  setStatus('Membuka jalur koneksi...');
  peer=new Peer(c,{debug:1});
  peer.on('open',()=>setStatus('Siap. Tunggu perangkat kedua masuk...'));
  peer.on('connection',c2=>{
    conn=c2;
    conn.on('open',()=>setStatus('TERHUBUNG ✓'));
    conn.on('error',e=>setStatus('Koneksi bermasalah: '+e.type));
  });
  peer.on('error',e=>{
    setStatus(e.type==='unavailable-id'?'Room sedang dipakai. Buat room baru.':'Koneksi gagal: '+e.type);
  });
}
function joinRoom(c){
  if(peer) peer.destroy();
  setStatus('Menghubungkan ke room...');
  peer=new Peer(undefined,{debug:1});
  peer.on('open',()=>{conn=peer.connect(c,{reliable:true});conn.on('open',()=>setStatus('TERHUBUNG ✓'));conn.on('error',e=>setStatus('Koneksi bermasalah: '+e.type));});
  peer.on('error',e=>setStatus('Koneksi gagal: '+e.type));
}
document.getElementById('create').onclick=()=>{
  const c=makeCode(); code.textContent=c; localStorage.setItem('hd2-room',c); startHost(c);
};
document.getElementById('connect').onclick=()=>{
  const c=document.getElementById('join').value.trim().toUpperCase();
  if(c.length!==6){setStatus('Masukkan kode 6 karakter.');return}
  joinRoom(c);
};
</script>
</body>
</html>

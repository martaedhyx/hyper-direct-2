<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101f">
<meta name="application-name" content="Hyper Direct">
<meta name="apple-mobile-web-app-title" content="Hyper Direct">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="https://martaedhyx.github.io/hyper-direct/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="https://martaedhyx.github.io/hyper-direct/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://martaedhyx.github.io/hyper-direct/apple-touch-icon.png?v=20261023">
<link rel="manifest" href="./manifest.webmanifest">
<meta http-equiv="Cache-Control" content="no-store">
<title>Hyper Direct</title>
<style>
:root{color-scheme:dark;--bg:#06101f;--panel:#0d1b30;--panel2:#10233b;--line:#1b4260;--cyan:#39e7ff;--blue:#318bff;--muted:#9ab6cc;--white:#edfaff}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:radial-gradient(ellipse at 50% -10%,#123e68 0%,#09182b 42%,var(--bg) 78%);background-attachment:fixed;color:var(--white);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:28px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mascot{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45)) drop-shadow(0 0 8px rgba(34,211,238,.18));animation:float 5s ease-in-out infinite}.mascot svg{width:100%;height:100%;display:block;overflow:visible}.mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}.brand-title{font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:-1.1px;line-height:1.1;background:linear-gradient(90deg,#f3fdff 0%,var(--cyan) 48%,#78aaff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #39e7ff22}
.tagline{margin:7px 0 24px;color:var(--muted);font-size:14px;line-height:1.65}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10233bea,#09172bed);border-radius:20px;padding:19px;margin-top:14px;border:1px solid var(--line);box-shadow:0 12px 35px #00000030}
.menu-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;margin-top:14px}
.menu-layout>.card{margin-top:0;min-width:0;padding:16px}
.menu-layout .code{font-size:clamp(17px,4vw,28px);letter-spacing:clamp(2px,1vw,6px);padding:14px 5px}
.menu-layout .small{font-size:12px}
.menu-layout .send-card{grid-column:1 / -1;width:min(100%,440px);justify-self:center}
.menu-layout button,.menu-layout input{min-width:0}
@media(max-width:390px){.menu-layout{gap:8px}.menu-layout>.card{padding:12px}.menu-layout .step{font-size:9px;letter-spacing:1px}.menu-layout button{padding:11px 7px;font-size:13px}.menu-layout .code{letter-spacing:2px;font-size:17px}}
@media(min-width:520px){.menu-layout>.card{padding:20px}}

.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent);opacity:.8}
.card h3{margin:0 0 8px}
.step{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan)}
.small{font-size:13px;color:var(--muted);line-height:1.65}
.code{text-align:center;font-size:clamp(27px,7vw,34px);font-weight:900;letter-spacing:7px;padding:16px 12px;background:linear-gradient(135deg,#071628,#102b46);border:1px solid #246486;border-radius:15px;margin-top:13px;color:#a5f6ff;text-shadow:0 0 18px #39e7ff55;box-shadow:inset 0 0 22px #39e7ff0b}
.status{padding:13px 14px;border-radius:13px;background:#081729;border:1px solid #193b56;margin-top:12px;color:#d3eaf7;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.status.connected{color:#8dffb0;background:rgba(25,255,112,.10);border:1px solid #39ff83;box-shadow:0 0 10px rgba(35,255,112,.22),inset 0 0 12px rgba(35,255,112,.06);font-weight:800;text-shadow:0 0 8px rgba(57,255,131,.28)}
.status.connected::before{content:"✓ ";display:inline-block;color:#39ff83;font-weight:900}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #27506d;font:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button{background:linear-gradient(100deg,#1677e8,#12bdd8);color:#031322;border:1px solid #52eaff;font-weight:850;margin-top:9px;box-shadow:0 5px 18px #0bbbd52a;cursor:pointer}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:hover{box-shadow:0 0 22px #39e7ff40}
input{background:#071629;color:var(--white)}
input::placeholder{color:#7192aa}
input[type=file]{background:#09192b;color:var(--muted);font-size:13px}
input[type=text]{text-transform:uppercase}
.files{margin-top:14px;display:grid;gap:12px}
.files:empty:after{content:"File yang diterima akan tampil di sini";display:block;padding:18px 14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #27506d;border-radius:14px;background:#07162980}
.fileitem{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:14px;background:linear-gradient(150deg,#10243a,#091729);border:1px solid #27506d;border-radius:16px;min-width:0;box-shadow:0 8px 22px #00000020}
.fileitem .file-name{display:flex;align-items:center;gap:9px;min-width:0;font-weight:750;color:#e5f8ff;overflow-wrap:anywhere;line-height:1.4}
.fileitem .file-name:before{content:"FILE";flex:none;font-size:10px;letter-spacing:1px;color:var(--cyan);padding:5px 7px;border-radius:7px;background:#39e7ff14;border:1px solid #27506d}
.file-preview{display:grid;place-items:center;min-height:44px;max-height:340px;overflow:hidden;background:#050d18;border:1px solid #1d3d56;border-radius:12px}
.file-preview img,.file-preview video{display:block;width:100%;max-height:320px;object-fit:contain;background:#050d18}
.file-preview audio{width:100%;padding:10px;max-width:100%}
.file-preview .preview-note{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.file-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fileitem a.download-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 15px;border-radius:11px;background:linear-gradient(100deg,#1677e8,#12bdd8);border:1px solid #52eaff;color:#031322;font-weight:850;text-decoration:none;white-space:nowrap}
.fileitem a.download-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.file-size{margin-right:auto;color:var(--muted);font-size:12px}
@media(min-width:520px){.wrap{padding-top:36px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Landing page Hyper Direct 1 — branding dan maskot asli */
/* ===== Landing / splash ===== */
.landing{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(0px + 24px) 20px calc(0px + 28px);padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);background:radial-gradient(120% 70% at 50% 0%,#0f1d3d 0%,#070b18 55%,#04060d 100%);transition:opacity .45s ease,transform .45s ease}
.landing.out{opacity:0;transform:scale(1.04);pointer-events:none}
.stars,.stars2{position:absolute;top:-20px;right:-20px;bottom:-20px;left:-20px;pointer-events:none;background-repeat:repeat}
.stars{background-size:220px 220px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 60px 120px,#e6f6ff,transparent),radial-gradient(2px 2px at 140px 60px,#fff,transparent),radial-gradient(1.4px 1.4px at 180px 170px,#cff,transparent),radial-gradient(1.8px 1.8px at 100px 200px,#fff,transparent);animation:twinkle 4.5s ease-in-out infinite}
.stars2{background-size:160px 160px;background-image:radial-gradient(1px 1px at 10px 90px,#fff,transparent),radial-gradient(1px 1px at 80px 20px,#bdf,transparent),radial-gradient(1.2px 1.2px at 130px 130px,#fff,transparent),radial-gradient(1px 1px at 50px 150px,#cff,transparent);animation:twinkle 3.2s ease-in-out infinite reverse;opacity:.7}
@keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.35}}
.l-glow{position:absolute;width:520px;height:520px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.13),transparent 62%);pointer-events:none}
.l-mascot{position:relative;width:160px;height:160px;width:clamp(132px,40vw,184px);height:clamp(132px,40vw,184px);animation:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(34,211,238,.25))}
.l-mascot svg{width:100%;height:100%;display:block;overflow:visible}
.l-mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.l-shadow{width:90px;width:clamp(72px,22vw,104px);height:12px;margin:10px auto 0;border-radius:50%;background:rgba(34,211,238,.35);filter:blur(7px);animation:none}
@keyframes lshadow{0%,100%{transform:scaleX(1);opacity:.65}50%{transform:scaleX(.7);opacity:.32}}
.l-title{position:relative;margin:30px 0 10px;font-family:'Orbitron','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:2.6rem;font-size:clamp(2.15rem,11.2vw,4.6rem);line-height:1.1;letter-spacing:.04em;background:linear-gradient(90deg,#22d3ee 0%,#38bdf8 45%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(34,211,238,.25)) drop-shadow(0 0 26px rgba(59,130,246,.16))}
.l-title span{display:inline-block}
.l-tag{position:relative;color:#fff;font-size:12px;letter-spacing:.32em;font-weight:600;margin:0 0 44px;padding-left:.32em}
.l-btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 38px;border-radius:999px;border:1.5px solid rgba(34,211,238,.75);background:rgba(17,25,40,.55);color:#22d3ee;font-weight:800;font-size:15px;letter-spacing:.18em;box-shadow:0 0 22px -6px rgba(34,211,238,.6),inset 0 0 14px rgba(34,211,238,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s,background .15s,color .15s}
.l-btn:active{transform:scale(.96);background:rgba(8,51,68,.7);color:#fff}
.l-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
.landing.fx{touch-action:none}
.landing.fx .l-canvas{display:block}
.landing.fx .stars,.landing.fx .stars2{display:none}
.landing.fx .l-mascot .m-eye{animation:none}
.l-flash{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95) 0%,rgba(165,243,252,.55) 22%,rgba(14,116,144,0) 62%)}
/* judul diketik huruf demi huruf (gradien per huruf diatur JS agar tetap menyambung) */
.l-title.lt{background:none}
.l-title .ch{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:no-repeat,no-repeat}
.l-title.typing .ch{opacity:0;transform:translateY(.14em) scale(.88)}
.l-title.typing .ch.on{opacity:1;transform:none;transition:opacity .16s ease,transform .26s cubic-bezier(.2,1.5,.4,1)}
.l-caret{position:absolute;width:.07em;height:.82em;background:#22d3ee;box-shadow:0 0 10px #22d3ee;border-radius:2px;animation:caret .8s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
.l-title .ch{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:no-repeat,no-repeat}
.l-title.typing .ch{opacity:0;transform:translateY(.14em) scale(.88)}
.l-title.typing .ch.on{opacity:1;transform:none;transition:opacity .16s ease,transform .26s cubic-bezier(.2,1.5,.4,1)}
.l-caret{position:absolute;width:.07em;height:.82em;background:#22d3ee;box-shadow:0 0 10px #22d3ee;border-radius:2px;animation:caret .8s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
.landing.fx .l-tag{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.landing.fx.typed .l-tag{opacity:1;transform:none}
/* warp saat MULAI ditekan */
.landing.warp{pointer-events:none}
.landing.warp .l-mascot{animation:lwarp .8s cubic-bezier(.5,0,.75,.2) forwards}
@keyframes lwarp{0%{transform:translateY(0)}18%{transform:translateY(10px) scale(1.06,.92)}100%{transform:translateY(-75vh) scale(.42,.6)}}
.landing.warp .l-shadow{opacity:0;transition:opacity .2s}
.landing.warp .l-title,.landing.warp .l-tag,.landing.fx.typed.warp .l-tag,.landing.warp .l-btn,.landing.warp .l-foot{opacity:0;transform:scale(.9) translateY(14px);transition:opacity .35s ease,transform .45s ease}
.landing.warp .l-flash{animation:lflash .8s ease-in forwards}
@keyframes lflash{0%,55%{opacity:0}100%{opacity:.9}}
.landing.warp.out{transition:opacity .3s ease}
.l-foot{position:absolute;left:0;right:0;bottom:calc(0px + 16px);bottom:calc(env(safe-area-inset-bottom) + 16px);font-size:11px;color:rgba(148,163,184,.6);letter-spacing:.08em}

/* Perbaikan tombol MULAI landing: pulihkan tampilan tombol utama HD1 */
.landing .l-btn{
  display:inline-flex!important;
  width:auto!important;
  min-width:112px;
  min-height:40px;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 24px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#22d3ee,#2563eb);
  color:#061322;
  font-weight:800;
  font-size:13px;
  letter-spacing:.14em;
  line-height:1.1;
  white-space:nowrap;
  box-shadow:0 8px 22px -8px rgba(34,211,238,.7);
  opacity:1;
  visibility:visible;
}
.landing .l-btn svg{display:block;flex:0 0 16px;width:16px;height:16px}
.landing .l-btn:active{transform:scale(.96);background:linear-gradient(135deg,#67e8f9,#3b82f6);color:#061322}



/* Visual-only menu refresh: backup is available in Git history. Transfer logic untouched. */
.wrap{max-width:820px;padding:24px 18px 42px}
.brand{padding:4px 2px 18px;border-bottom:1px solid #17374e;gap:14px}
.mascot{width:58px;height:58px}
.brand-title{font-size:clamp(30px,7vw,42px);letter-spacing:-1.25px}
.tagline{font-size:15px;margin:10px 0 20px}
.menu-layout{gap:14px;margin-top:18px}
.menu-layout>.card{padding:20px;border-radius:26px;border:1px solid #203d6b;background:linear-gradient(145deg,#14233d 0%,#101b30 70%,#0d192b 100%);box-shadow:0 12px 28px #0002}
.menu-layout>.card:before{display:none}
.menu-layout .step{font-size:12px;letter-spacing:2px;color:#8d9db6}
.menu-layout .code{font-size:clamp(30px,8vw,42px);letter-spacing:8px;border:0;background:transparent;box-shadow:none;text-align:left;padding:6px 0 12px;color:#f0f6ff;text-shadow:none}
.menu-layout button{min-height:52px;margin-top:12px;border:1px solid #243553;border-radius:16px;background:#1a2944;color:#e7f0ff;box-shadow:none;font-weight:800;padding:14px 16px}
.menu-layout button:hover{background:#213653;box-shadow:0 0 0 1px #39e7ff30}
.menu-layout button:active{transform:scale(.985)}
.menu-layout input[type=text]{min-height:52px;border:1px solid #243553;border-radius:16px;background:#0b1729;padding:14px 16px;font-size:18px}
.menu-layout input[type=file]{border:1px dashed #168ea7;border-radius:20px;background:#0f2b40;padding:16px;color:#c4d4e8}
.menu-layout .status{border:0;border-radius:16px;background:#173148;padding:13px 15px;color:#cbd9e9}
.menu-layout .status.connected{background:#12392f;border:1px solid #216e56;color:#6df0ba;box-shadow:none;text-shadow:none}
.menu-layout .small{font-size:14px;line-height:1.6}
.menu-layout .send-card{width:100%;justify-self:stretch}
.menu-layout .send-card>button{background:linear-gradient(110deg,#21cde5,#388bff);border:0;color:#071528}
.files{gap:14px;margin-top:16px}
.files:empty:after{content:"Belum ada file.\A Pilih Foto / Video, atau tunggu kiriman teman — file yang diterima muncul di sini.";white-space:pre-line;padding:30px 18px;min-height:150px;display:flex;align-items:center;justify-content:center;border:1px dashed #263a5c;border-radius:24px;background:#142039;color:#91a0b8;font-size:15px;line-height:1.65}
.fileitem{padding:16px;border:1px solid #243d67;border-radius:22px;background:#142039;box-shadow:none}
.fileitem .file-name:before{content:"FILE";border-radius:9px;background:#173b50;border-color:#22516c}
.file-preview{border-radius:16px;border-color:#243b5c;background:#071222;min-height:60px}
.file-preview img,.file-preview video{max-height:420px}
.fileitem a.download-btn{min-height:46px;border:0;border-radius:14px;background:linear-gradient(110deg,#21cde5,#388bff);color:#061526;box-shadow:none}
@media(max-width:430px){
 .wrap{padding:18px 14px 34px}
 .brand{gap:12px;padding-bottom:16px}
 .mascot{width:50px;height:50px}
 .menu-layout{gap:10px}
 .menu-layout>.card{padding:15px;border-radius:22px}
 .menu-layout .step{font-size:10px;letter-spacing:1.2px}
 .menu-layout button{font-size:14px;padding:13px 9px;min-height:48px}
 .menu-layout .code{font-size:29px;letter-spacing:5px}
 .menu-layout .small{font-size:12px}
 .files:empty:after{font-size:14px}
}


/* Background hitam penuh — hanya Hyper Direct 2 utama */
:root{--bg:#000;--panel:#000;--panel2:#000}
body{background:#000!important}
.card,.menu-layout>.card,.code,.status,input,input[type=file],.fileitem,
.files:empty:after,.file-preview,.file-preview img,.file-preview video{
  background:#000!important;
}
.landing{background:#000!important}


/* Monochrome black and white theme for main app */
.l-glow{display:none}
.l-mascot,.mascot{filter:none}
.l-title,.brand-title{background:none;color:#fff;-webkit-text-fill-color:#fff;text-shadow:none;filter:none}
.l-title .ch{background-image:none;color:#fff;-webkit-text-fill-color:#fff}
.landing .l-btn{background:#fff;color:#000;border:1px solid #fff;box-shadow:none}
.landing .l-btn:active{background:#e8e8e8;color:#000}
.brand{border-bottom-color:#fff}
.card,.menu-layout>.card,.fileitem{background:#000;border:1px solid #fff;box-shadow:none}
.card:before,.menu-layout>.card:before{background:#fff;opacity:1}
.step,.small,.tagline,.l-foot{color:#fff}
.code{background:#000;color:#fff;border:1px solid #fff;text-shadow:none}
.status,.menu-layout .status,.files:empty:after{background:#000;color:#fff;border:1px solid #fff;box-shadow:none;text-shadow:none}
.status.connected,.menu-layout .status.connected{background:#000;color:#fff;border:1px solid #fff;box-shadow:none;text-shadow:none}
button,.menu-layout button,.menu-layout .send-card>button,.fileitem a.download-btn{background:#fff;color:#000;border:1px solid #fff;box-shadow:none}
button:hover,.menu-layout button:hover{background:#e8e8e8;color:#000;box-shadow:none}
button:active{background:#d9d9d9;color:#000}
input,.menu-layout input[type=text],input[type=file]{background:#000;color:#fff;border:1px solid #fff}
input::placeholder{color:#d0d0d0}
.file-preview,.file-preview img,.file-preview video,.fileitem .file-name:before{background:#000;color:#fff;border-color:#fff}
.fileitem .file-name{color:#fff}
.fileitem a.download-btn{color:#000}
.files:empty:after{border-style:dashed}
.l-tag{color:#fff}


/* Final strict black-and-white pass: remove remaining colored accents */
:root{--cyan:#fff;--blue:#fff;--line:#fff;--accent:#fff;--accent2:#fff}
.l-glow,.l-shadow,#lCheeks,.brand .mascot ellipse[fill="#ff8fb1"]{display:none!important}
.l-canvas,.stars,.stars2{display:none!important}
.l-mascot,.mascot{filter:none!important;box-shadow:none!important}
.l-title,.l-title .ch,.brand-title{background:none!important;background-image:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:none!important;filter:none!important}
.l-btn,.landing .l-btn{background:#fff!important;color:#000!important;border-color:#fff!important;box-shadow:none!important}
.l-btn:active,.landing .l-btn:active{background:#e5e5e5!important;color:#000!important}
.brand,.brand:before,.brand:after{border-color:#fff!important;box-shadow:none!important}
.brand .mascot svg [stroke]:not([stroke="none"]){stroke:#fff!important}
.card,.menu-layout>.card,.fileitem,.code,.status,.files:empty:after,input,input[type=file],.file-preview,.file-preview img,.file-preview video{border-color:#fff!important;box-shadow:none!important}
.card:before,.menu-layout>.card:before{background:#fff!important;opacity:1!important}

button:hover,.menu-layout button:hover,button:active{background:#e5e5e5!important;color:#000!important;border-color:#fff!important}
input,input[type=file],.menu-layout input[type=text]{background:#000!important;color:#fff!important;border-color:#fff!important}
input::placeholder{color:#ddd!important}
.step,.small,.tagline,.l-foot,.fileitem .file-name,.file-preview,.code,.status,.menu-layout .status{color:#fff!important;text-shadow:none!important}
.status.connected,.menu-layout .status.connected{background:#000!important;color:#fff!important;border-color:#fff!important;box-shadow:none!important}
.menu-layout .code{background:#000!important;color:#fff!important;border:1px solid #fff!important}
.menu-layout svg [stroke]:not([stroke="none"]){stroke:#fff!important}
.menu-layout [style*="border-color"],.menu-layout [style*="border:"],.menu-layout hr{border-color:#fff!important}


/* Hyper Direct eye motion v2: visibly active, original eye shapes and fills retained */
@keyframes hdEyesActiveV2{
  0%,7%,100%{transform:translate(0,0) scaleY(1.15)}
  10%,16%{transform:translate(-5px,0) scaleY(1.15)}
  20%,26%{transform:translate(0,5px) scaleY(1.15)}
  30%,36%{transform:translate(0,0) scaleY(1.15)}
  39%,41%{transform:translate(0,7px) scaleY(.10)}
  43%,49%{transform:translate(0,0) scaleY(1.15)}
  53%,59%{transform:translate(4px,-2px) scaleY(1.15)}
  63%,69%{transform:translate(-3px,3px) scaleY(1.15)}
  73%,78%{transform:translate(0,0) scaleY(1.15)}
  81%,84%{transform:translate(0,7px) scaleY(.10)}
  87%,94%{transform:translate(0,0) scaleY(1.15)}
}
@keyframes hdEyesWinkV2{
  0%,38%,44%,100%{transform:translate(0,0) scaleY(1.15)}
  40%,42%{transform:translate(0,7px) scaleY(.08)}
}
.l-mascot #lEyes rect.m-eye,.brand .mascot svg rect.m-eye{
  animation:hdEyesActiveV2 5.6s ease-in-out infinite!important;
  transform-box:fill-box!important;transform-origin:center!important;
}
.brand .mascot svg rect.m-eye:nth-of-type(1){animation:hdEyesActiveV2 5.6s ease-in-out infinite!important}
.brand .mascot svg g:nth-of-type(2) rect.m-eye{animation:hdEyesWinkV2 5.6s ease-in-out infinite!important}
@media(prefers-reduced-motion:reduce){
 .l-mascot #lEyes rect.m-eye,.brand .mascot svg rect.m-eye{animation:none!important}
}

/* Keep the connected status neon green, even with the monochrome menu theme */
.status.connected,.menu-layout .status.connected{

}

<script>
(function(){
  var mascot=document.querySelector('.landing .l-mascot');

  var gazeTimer=null,step=0;
  function look(dx,dy){
    eyes.forEach(function(el,i){
      el.style.transition='transform 180ms ease-out';

    });
  }
  function reset(){
    eyes.forEach(function(el){el.style.translate='0px 0px';});
  }
  /* Natural, lively glances; the original eye shapes and fills are untouched. */
  function nextGaze(){
    if(document.hidden)return;
    var patterns=[[1.1,0],[-1.1,.25],[0,-.65],[.55,.55],[-.6,-.2],[0,0],[1,.35],[-.8,.1],[0,0]];
    var p=patterns[step++%patterns.length];
    look(p[0],p[1]);

      reset();
      gazeTimer=window.setTimeout(nextGaze,420+Math.random()*1050);
    },260+Math.random()*330);
  }
  gazeTimer=window.setTimeout(nextGaze,500);
  window.addEventListener('pointermove',function(ev){
    var r=mascot.getBoundingClientRect();
    var dx=Math.max(-1,Math.min(1,(ev.clientX-(r.left+r.width/2))/(r.width/2)));
    var dy=Math.max(-1,Math.min(1,(ev.clientY-(r.top+r.height/2))/(r.height/2)));

  },{passive:true});
  document.addEventListener('visibilitychange',function(){if(document.hidden)reset();});
})();
(function(){
  var L=document.getElementById('landing'), cv=document.getElementById('lCanvas'), title=document.getElementById('lTitle');

    var r=L.getBoundingClientRect(),m=document.querySelector('.l-mascot').getBoundingClientRect();

    cx=m.width?m.left+m.width/2-r.left:w/2;cy=m.height?m.top+m.height/2-r.top:h*.4;
    var want=Math.min(160,Math.max(50,Math.round(w*h/2300)));

    if(!ctx||!L.isConnected||L.style.display==='none')return;
    var dt=Math.min(.05,last?(t-last)/1000:.016);last=t;ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],prev=s.z;s.z-=.045*dt;
      if(s.z<=.03){stars[i]=newStar(false);continue}

  size();nextShoot=performance.now()+rnd(1800,3200);if(ctx)draw(0);

  var letters=[],titleWidth=0,glint=-1,glintT0=0,nextGlint=0,typed=false;

   var GLINT='linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%)';

   function layoutLetters(){if(!letters.length)return;titleWidth=title.clientWidth||w;letters.forEach(function(el){el._x=el.offsetLeft;el._y=el.offsetTop;el.style.backgroundImage=GLINT+','+BASEG;el.style.backgroundSize=Math.round(titleWidth*.32)+'px 100%,'+titleWidth+'px 100%';});paintGlint();}

   splitTitle();var fontReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(resolve){setTimeout(resolve,900);})]):Promise.resolve();fontReady.then(function(){layoutLetters();typeTitle();});
   var eyes=document.querySelectorAll('#lEyes rect'), mascot=document.querySelector('.l-mascot');
  // Badan maskot tetap di tempat; hanya mata yang mengikuti pointer.
  if(mascot){mascot.style.animation='none';mascot.style.translate='0px 0px';mascot.style.rotate='0deg';mascot.style.willChange='auto';}
  var eyeX=0,eyeY=0,eyeBlink=1;
  function paintEyes(){eyes.forEach(function(el){el.style.transform='translate('+eyeX.toFixed(1)+'px,'+eyeY.toFixed(1)+'px) scaleY('+eyeBlink+')';});}
  // Gerakan mengikuti kursor dinonaktifkan; kedipan otomatis tetap aktif.
  if(!reduced){
    function blink(){

      eyeBlink=.12;paintEyes();

})();

<script>

(function(){
  var svg=document.querySelector('.mascot svg');
  if(!svg)return;
  var eyes=Array.from(svg.querySelectorAll('g rect'));
  if(eyes.length<2)return;
  var bases=eyes.map(function(el){return {el:el,x:parseFloat(el.getAttribute('x')),y:parseFloat(el.getAttribute('y')),h:parseFloat(el.getAttribute('height'))};});
  window.addEventListener('pointermove',function(ev){
    var r=svg.getBoundingClientRect();
    var px=((ev.clientX-r.left)/r.width-.5)*2;
    var py=((ev.clientY-r.top)/r.height-.5)*2;
    bases.forEach(function(b){b.el.setAttribute('x',(b.x+Math.max(-1,Math.min(1,px))*2.1).toFixed(2));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,py))*1.8).toFixed(2));});
  },{passive:true});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    function blink(){
      bases.forEach(function(b){b.el.setAttribute('height','2');b.el.setAttribute('y',(parseFloat(b.el.getAttribute('y'))+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',(b.y+Math.max(-1,Math.min(1,((window.innerHeight/2)-b.y)/window.innerHeight))*0).toFixed(2));});},130);
    }
    function restore(){bases.forEach(function(b){b.el.setAttribute('height',String(b.h));});}
    window.setInterval(function(){
      var ys=bases.map(function(b){return parseFloat(b.el.getAttribute('y'));});
      bases.forEach(function(b,i){b.el.setAttribute('height','2');b.el.setAttribute('y',(ys[i]+b.h-2).toFixed(2));});
      window.setTimeout(function(){bases.forEach(function(b,i){b.el.setAttribute('height',String(b.h));b.el.setAttribute('y',ys[i].toFixed(2));});},135);
    },3600);
  }
})();
window.hdPeer=null;window.hdConn=null;window.hdMeta=null;window.hdParts=[];window.hdReceived=0;window.hdWaiting=null;

function hdCode(){return String(Math.floor(Math.random()*1000)).padStart(3,'0')}
window.hdCopyRoomCode=function(){var el=document.getElementById('code');var code=(el&&el.textContent||'').trim();if(!/^\d{3}$/.test(code)){hdStatus('Buat room terlebih dahulu.');return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){hdStatus('Kode room disalin: '+code)}).catch(function(){hdStatus('Kode room: '+code)})}else{hdStatus('Kode room: '+code)}};

function hdBind(c){

   var url=ev.url||'URL tidak tersedia';

   var code=ev.errorCode||'tanpa kode';
   console.warn('[HD2 ICE/TURN]',{code:code,url:url,detail:detail,address:ev.address||'',port:ev.port||0});
   hdStatus('ICE/TURN '+code+' — '+url+' — '+detail);
  });
 }
 iceTimer=window.setInterval(function(){attachPc();pollCount++;if(pc||pollCount>80){window.clearInterval(iceTimer)}},250);
 var hdConnectTimer=window.setTimeout(function(){
  if(!c.open){
   attachPc();
   var closed=(c.open===false&&c.peerConnection&&c.peerConnection.signalingState==='closed');

  }
 },20000);
 c.on('open',function(){window.clearTimeout(hdConnectTimer);if(iceTimer)window.clearInterval(iceTimer);attachPc();if(c.dataChannel)c.dataChannel.binaryType='arraybuffer';hdStatus('TERHUBUNG ✓')});
 c.on('close',function(){window.clearTimeout(hdConnectTimer);if(iceTimer)window.clearInterval(iceTimer);hdStatus('Koneksi terputus.')});

 c.on('data',function(data){if(data&&data.kind==='file-start'){window.hdMeta=data;window.hdParts=[];window.hdReceived=0;window.hdLastAck=0;window.hdAcked=0;hdTransfer('Menerima '+data.name+' (0%)...');return}if(data&&data.kind==='ack'){window.hdWaiting=Math.max(window.hdWaiting||0,data.n);window.hdAcked=Math.max(window.hdAcked||0,data.n);return}if(window.hdMeta&&(data instanceof ArrayBuffer||ArrayBuffer.isView(data))){var u=data instanceof ArrayBuffer?new Uint8Array(data):new Uint8Array(data.buffer,data.byteOffset,data.byteLength);window.hdParts.push(u);window.hdReceived+=u.byteLength;var now=Date.now();if(!window.hdLastUi||now-window.hdLastUi>=120||window.hdReceived>=window.hdMeta.size){window.hdLastUi=now;hdTransfer('Menerima '+Math.round(window.hdReceived/window.hdMeta.size*100)+'%...')}if(window.hdReceived-window.hdLastAck>=1048576||window.hdReceived>=window.hdMeta.size){window.hdLastAck=window.hdReceived;c.send({kind:'ack',n:window.hdReceived})}return}if(data&&data.kind==='file-end'&&window.hdMeta){var meta=window.hdMeta;var blob=new Blob(window.hdParts,{type:meta.type||'application/octet-stream'});var fileUrl=URL.createObjectURL(blob);var a=document.createElement('a');a.href=fileUrl;a.download=meta.name;a.textContent='⬇ Download';a.className='download-btn';var item=document.createElement('div');item.className='fileitem';var label=document.createElement('div');label.className='file-name';label.textContent=meta.name;item.appendChild(label);var preview=document.createElement('div');preview.className='file-preview';var type=String(meta.type||'').toLowerCase();if(type.indexOf('image/')===0){var img=document.createElement('img');img.src=fileUrl;img.alt='Pratinjau '+meta.name;img.loading='lazy';preview.appendChild(img)}else if(type.indexOf('video/')===0){var video=document.createElement('video');video.src=fileUrl;video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label','Pemutar video '+meta.name);preview.appendChild(video)}else if(type.indexOf('audio/')===0){var audio=document.createElement('audio');audio.src=fileUrl;audio.controls=true;audio.preload='metadata';audio.setAttribute('aria-label','Pemutar audio '+meta.name);preview.appendChild(audio)}else{var note=document.createElement('div');note.className='preview-note';note.textContent='Pratinjau tidak tersedia untuk format ini. File tetap bisa diunduh.';preview.appendChild(note)}item.appendChild(preview);var actions=document.createElement('div');actions.className='file-actions';var size=document.createElement('span');size.className='file-size';size.textContent=(meta.size/1048576).toFixed(meta.size<1048576?2:1)+' MB';actions.appendChild(size);actions.appendChild(a);item.appendChild(actions);document.getElementById('files').prepend(item);hdTransfer('File diterima ✓');window.hdMeta=null;window.hdParts=[];window.hdReceived=0;window.hdLastAck=0}})}
window.hdSendFile=async function(){var f=document.getElementById('file').files[0];if(!f){hdTransfer('Pilih foto/file dulu.');return}if(!window.hdConn||!window.hdConn.open){hdTransfer('Belum terhubung.');return}var conn=window.hdConn;var chunkSize=32768,highWater=1048576,lastUi=0;window.hdAcked=0;conn.send({kind:'file-start',name:f.name,size:f.size,type:f.type});var pos=0;while(pos<f.size){if(!conn.open){hdTransfer('Koneksi terputus saat mengirim.');return}while(pos-(window.hdAcked||0)>=2*1048576){if(!conn.open){hdTransfer('Koneksi terputus saat mengirim.');return}await new Promise(function(r){setTimeout(r,5)})}var dc=conn.dataChannel;if(dc&&dc.bufferedAmount>highWater){await new Promise(function(r){setTimeout(r,5)});continue}var end=Math.min(pos+chunkSize,f.size);var b=await f.slice(pos,end).arrayBuffer();if(!conn.open){hdTransfer('Koneksi terputus saat mengirim.');return}conn.send(b);pos+=b.byteLength;var now=Date.now();if(now-lastUi>=120||pos>=f.size){lastUi=now;hdTransfer('Mengirim '+Math.round(pos/f.size*100)+'% · '+(pos/1048576).toFixed(1)+' / '+(f.size/1048576).toFixed(1)+' MB · diterima '+Math.round((window.hdAcked||0)/f.size*100)+'%')}}while((window.hdAcked||0)<f.size){if(!conn.open){hdTransfer('Koneksi terputus saat menunggu konfirmasi penerima.');return}await new Promise(function(r){setTimeout(r,10)})}conn.send({kind:'file-end'});hdTransfer('File terkirim dan diterima ✓')};
